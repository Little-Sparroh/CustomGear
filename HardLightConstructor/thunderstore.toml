[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "HardLightConstructor"
description = "Hard-Light Constructor — full-auto hard-light plasma primary. Applies Shatter; full saturation Jams (no DoT). Phase 1 baseline."
websiteUrl = "https://github.com/Little-Sparroh/HardLightConstructor"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/HardLightConstructor.dll"
target = "BepInEx/plugins/HardLightConstructor.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
