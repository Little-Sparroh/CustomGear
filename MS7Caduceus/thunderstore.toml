[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "MS7Caduceus"
description = "MS-7 Caduceus — SAXON field-medic tether primary. Hold to lock Mend / Overclock / Judgment. Builds Grace for Discharge."
websiteUrl = "https://github.com/Little-Sparroh/MS7Caduceus"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"
Sparroh-SparrohUILib = "1.2.2"



[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/MS7Caduceus.dll"
target = "BepInEx/plugins/MS7Caduceus.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
