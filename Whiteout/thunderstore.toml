[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Whiteout"
description = "SAXON W-9 Whiteout — continuous cryo projector primary. Hold fire to hose a frost cone; secondary lobs a mag-fed rime cell."
websiteUrl = "https://github.com/Little-Sparroh/Whiteout"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Whiteout.dll"
target = "BepInEx/plugins/Whiteout.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods", "client" ]
