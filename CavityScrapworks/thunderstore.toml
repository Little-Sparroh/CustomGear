[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "CavityScrapworks"
description = "Cavity Scrapworks — SAXON cavity-fed magnetic plateworks. Parallel Plate Launcher primary with stick, recall, and catch baseline."
websiteUrl = "https://github.com/Little-Sparroh/CavityScrapworks"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/CavityScrapworks.dll"
target = "BepInEx/plugins/CavityScrapworks.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
