[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "ThermalSolstice"
description = "Thermal Solstice — SAXON continuous thermal siege beam heavy. Soft Heat channel, strong native Fire. Reactor / Conflagration / Optics paths coming later."
websiteUrl = "https://github.com/Little-Sparroh/ThermalSolstice"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/ThermalSolstice.dll"
target = "BepInEx/plugins/ThermalSolstice.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
