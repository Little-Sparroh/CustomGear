[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "SaxoniteWrench"
description = "SAXON gravitic impact wrench melee kit. Tap smash or charge slam, shockwave, gravity pull. Soft-depends on MeleeRework for the melee loadout slot."
websiteUrl = "https://github.com/Little-Sparroh/SaxoniteWrench"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"
Sparroh-MeleeRework = "0.1.3"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/SaxoniteWrench.dll"
target = "BepInEx/plugins/SaxoniteWrench.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
