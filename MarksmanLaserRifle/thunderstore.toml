[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "DMLRRework"
description = "Marksman Laser Rifle — dual-mode DMLR rework. Auto DMR tags anatomy; hold-aim laser executes. Severance upgrades: Mark, Expose, Transfer. Independent gear; vanilla Scout untouched."

websiteUrl = "https://github.com/Little-Sparroh/DMLRRework"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/DMLRRework.dll"
target = "BepInEx/plugins/DMLRRework.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
