[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "RapturesChosen"
description = "Rapture's Chosen — dual-mode shock lance. Charge M1 for a piercing coil; hold RMB to charge and release Auger. Vanilla Shocklance untouched."
websiteUrl = "https://github.com/Little-Sparroh/RapturesChosen"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/RapturesChosen.dll"
target = "BepInEx/plugins/RapturesChosen.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
