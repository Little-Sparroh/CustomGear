[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "BloodCarver"
description = "Blood Carver — industrial chainsaw primary that harvests Blood, spends it on Exsanguinate, and feeds your heavy. Phase 0/1 baseline."
websiteUrl = "https://github.com/Little-Sparroh/BloodCarver"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/BloodCarver.dll"
target = "BepInEx/plugins/BloodCarver.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
