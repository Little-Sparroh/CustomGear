[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "HeavenPiercer"
description = "Heaven Piercer — SAXON industrial compound bow. Hold to draw; charge scales damage, speed, range, and gravity. Time the sweet spot."
websiteUrl = "https://github.com/Little-Sparroh/HeavenPiercer"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/HeavenPiercer.dll"
target = "BepInEx/plugins/HeavenPiercer.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
