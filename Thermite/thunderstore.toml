[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Thermite"
description = "Fire-element grenade. Stock throw is a clean thermite boom. Upgrades unlock instant welding heals, self-combustion triage, mobile ember recharge, cluster bomblets, and scorched earth."
websiteUrl = "https://github.com/Little-Sparroh/Thermite"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Thermite.dll"
target = "BepInEx/plugins/Thermite.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
