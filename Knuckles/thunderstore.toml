[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "MeleeRework"
description = "Melee loadout slot + Fists baseline rework. Tap V to jab; hold V / Guard / upgrade grid coming in later builds."
websiteUrl = "https://github.com/Little-Sparroh/MeleeRework"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/MeleeRework.dll"
target = "BepInEx/plugins/MeleeRework.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
