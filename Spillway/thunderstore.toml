[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Spillway"
description = "Spillway — solvent grenade hose primary. Parallel Globbler-class weapon with raised empty-grid baseline. Cook / storm / recipe paths coming later."
websiteUrl = "https://github.com/Little-Sparroh/Spillway"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Spillway.dll"
target = "BepInEx/plugins/Spillway.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
