[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "AussieSpecial"
description = "Aussie Special — break-action hopping shotgun. Twin triggers, shared mag of two, bounce-waking shells. Vanilla Jackrabbit untouched."
websiteUrl = "https://github.com/Little-Sparroh/AussieSpecial"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/AussieSpecial.dll"
target = "BepInEx/plugins/AussieSpecial.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
