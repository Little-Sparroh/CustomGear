[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Zephyr"
description = "Zephyr — SAXON industrial sonic overpressure cannon. Instant semi cone blast with knockback and scarce ammo. Phase 0/1 baseline."
websiteUrl = "https://github.com/Little-Sparroh/Zephyr"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Zephyr.dll"
target = "BepInEx/plugins/Zephyr.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
