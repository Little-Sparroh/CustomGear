[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "HelminthReceiver"
description = "SAXON Type-L bio-ordnance primary. Fires on Vitality, light leech on hit, hold reload to Feed Host health into the weapon."
websiteUrl = "https://github.com/Little-Sparroh/HelminthReceiver"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"
Sparroh-SparrohUILib = "1.2.2"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/HelminthReceiver.dll"
target = "BepInEx/plugins/HelminthReceiver.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods", "client" ]
