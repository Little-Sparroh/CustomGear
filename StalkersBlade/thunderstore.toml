[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "StalkersBlade"
description = "Stalker's Blade melee kit — crouch Ambush, opener cuts, thrown Mark. Soft-depends on MeleeRework for the melee loadout slot."
websiteUrl = "https://github.com/Little-Sparroh/StalkersBlade"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/StalkersBlade.dll"
target = "BepInEx/plugins/StalkersBlade.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
