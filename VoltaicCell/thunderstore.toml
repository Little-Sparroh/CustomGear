[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "VoltaicCell"
description = "Shock-element throwable. Stock throw is a clean lightning boom. Upgrades (later) unlock live-wire storms, capacitor overshields, and illegal pocket economics."
websiteUrl = "https://github.com/Little-Sparroh/VoltaicCell"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/VoltaicCell.dll"
target = "BepInEx/plugins/VoltaicCell.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods", "client" ]
