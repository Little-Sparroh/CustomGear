[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Chaingun"
description = "SAXON CG-6 Chaingun — full-auto rotary kinetic primary. Barrels spool up while firing. Modest damage per round; power is volume and position."
websiteUrl = "https://github.com/Little-Sparroh/Chaingun"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Chaingun.dll"
target = "BepInEx/plugins/Chaingun.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
