[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "BoardingTrident"
description = "Boarding Trident — pirate boarding multi-prong primary. Hip horizontal rake, ADS vertical stake. Parallel to vanilla Trident S2."
websiteUrl = "https://github.com/Little-Sparroh/BoardingTrident"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/BoardingTrident.dll"
target = "BepInEx/plugins/BoardingTrident.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
