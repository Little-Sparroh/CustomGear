[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Bravura"
description = "SAXON BR-88 exhibition carbine. Style Rank grades variety and aggression. Five baseline verbs: Verse, Chorus, Tag, Flourish, Entrance."
websiteUrl = "https://github.com/Little-Sparroh/Bravura"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Bravura.dll"
target = "BepInEx/plugins/Bravura.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
