[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Hooklash"
description = "Hooklash melee kit — two-hit lash string and bidirectional tether. Soft-depends on MeleeRework for the melee loadout slot."
websiteUrl = "https://github.com/Little-Sparroh/Hooklash"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Hooklash.dll"
target = "BepInEx/plugins/Hooklash.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
