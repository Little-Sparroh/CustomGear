[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "HiveLauncher"
description = "Hive Launcher — living pellet swarm primary. Plant a hovering cloud, release to dive. Separate from vanilla Swarm Launcher."
websiteUrl = "https://github.com/Little-Sparroh/HiveLauncher"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/HiveLauncher.dll"
target = "BepInEx/plugins/HiveLauncher.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
