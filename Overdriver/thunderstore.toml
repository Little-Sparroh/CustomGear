[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "Overdriver"
description = "Overdriver — SAXON OD-2 full-auto shock burster. Parallel primary; vanilla Accelerator untouched. Phase 0/1 base hose."
websiteUrl = "https://github.com/Little-Sparroh/Overdriver"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/Overdriver.dll"
target = "BepInEx/plugins/Overdriver.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
