[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "SiegeCannon"
description = "Siege Cannon — SAXON portable gunship shell primary. Full-auto explosive shells with Battery, Halo, and Ordnance upgrade paths (paths WIP)."
websiteUrl = "https://github.com/Little-Sparroh/SiegeCannon"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/SiegeCannon.dll"
target = "BepInEx/plugins/SiegeCannon.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
