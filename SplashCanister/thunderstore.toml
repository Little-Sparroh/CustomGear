[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "SplashCanister"
description = "Water path throwable. Rides surfaces like a disc and paints a short-lived wet wall — soak enemies so other elements pay out."
websiteUrl = "https://github.com/Little-Sparroh/SplashCanister"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/SplashCanister.dll"
target = "BepInEx/plugins/SplashCanister.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods", "client" ]
