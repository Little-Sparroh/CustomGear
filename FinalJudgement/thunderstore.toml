[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "FinalJudgement"
description = "Final Judgement — SAXON strategic charge heavy. Hold ~8s, fire one rocket with a classic explosive sphere. Warhead / Hammer / Retribution paths coming later."
websiteUrl = "https://github.com/Little-Sparroh/FinalJudgement"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/FinalJudgement.dll"
target = "BepInEx/plugins/FinalJudgement.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
