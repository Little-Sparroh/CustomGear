[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "RhythmStitchers"
description = "Rhythm Stitchers — dual machine pistols. LMB left, RMB right, independent mags, shared Tempo. Accelerator clone baseline."
websiteUrl = "https://github.com/Little-Sparroh/RhythmStitchers"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/RhythmStitchers.dll"
target = "BepInEx/plugins/RhythmStitchers.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "mods" ]
